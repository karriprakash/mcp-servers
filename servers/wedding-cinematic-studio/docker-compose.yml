# From servers/wedding-cinematic-studio:
#   NVIDIA GPU:  docker compose --profile gpu build && docker compose --profile gpu up -d
#   No GPU/Mac:  docker compose --profile cpu build && docker compose --profile cpu up -d
# Put photos and the card in ./inputs (read-only inside the container as /inputs).
# Everything produced or downloaded goes to ./data (it must be writable by uid 10001:
#   mkdir -p data inputs && sudo chown 10001:10001 data   (on Linux))
# The MCP endpoint is published on 127.0.0.1 only: there is no login, so reach it via an SSH tunnel.
services:
  studio-gpu:
    profiles: ["gpu"]
    build: {context: ., dockerfile: docker/Dockerfile.gpu, args: {FACE_QC: "${FACE_QC:-0}"}}
    ports: ["127.0.0.1:8000:8000"]
    environment: &env
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      HF_TOKEN: "${HF_TOKEN:-}"
      LTX_WIDTH: "${LTX_WIDTH:-}"
      LTX_HEIGHT: "${LTX_HEIGHT:-}"
      LTX_MAX_FRAMES: "${LTX_MAX_FRAMES:-121}"
    volumes: &vols
      - ${DATA_DIR:-./data}:/data
      - ${INPUT_DIR:-./inputs}:/inputs:ro
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    restart: unless-stopped

  studio-cpu:
    profiles: ["cpu"]
    build: {context: ., dockerfile: docker/Dockerfile.cpu}
    ports: ["127.0.0.1:8000:8000"]
    environment: *env
    volumes: *vols
    restart: unless-stopped
